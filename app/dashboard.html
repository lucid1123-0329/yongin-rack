<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>중용 - 대시보드</title>
  <meta name="description" content="견적 대시보드 및 이력 관리">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2F6BFF', accent: '#FF6B00' },
          fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
        },
      },
    };
  </script>

  <!-- Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/css/design.css?v=74">

  <style>
    :root{--bg:#F2F4F6;--canvas:#F2F4F6;--surface:#FFFFFF;--fill:#F2F4F6;--fill-2:#E5E8EB;--line:#EEF0F2;--rule:#EEF0F2;--text:#191F28;--ink:#191F28;--text-2:#4E5968;--ink-2:#4E5968;--text-3:#8B95A1;--brand:#2F6BFF;--brand-weak:#E8F0FF;--accent:#FF6B00;--ok:#1FA36B;--ok-weak:#E6F7EF;--danger:#F04452;--danger-weak:#FEECEE;--r-card:20px;--r-ctl:14px;--r-chip:999px;--r-sheet:24px;--shadow-card:0 2px 12px rgba(25,31,40,.06);--s1:8px;--s2:12px;--s3:16px;--s4:20px;--s5:24px;--s6:32px}
    body { font-family: 'Pretendard', sans-serif; padding-bottom: 80px; }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="/js/onesignal-init.js?v=74" defer></script>
  <script src="/js/version-check.js" defer></script>
</head>
<body class="yr-admin-app bg-[#f7fafc] min-h-screen">
  <div id="page-loading" class="hidden fixed inset-0 bg-white z-50 flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mx-auto mb-3"></div>
      <p class="text-sm text-gray-500" id="loading-text">처리 중...</p>
    </div>
  </div>

  <!-- 헤더 -->
  <header class="bg-primary text-white px-4 py-4 sticky top-0 z-40">
    <h1 class="text-lg font-bold">대시보드</h1>
  </header>

  <main class="max-w-lg mx-auto">
    <!-- 통계 카드 -->
    <div class="v2-stat-grid mx-4 mt-4 grid grid-cols-3 gap-2" id="stat-cards">
      <div class="v2-stat-card v2-stat-skeleton animate-pulse bg-white rounded-xl border border-gray-100 p-4">
        <div class="v2-stat-skeleton-label h-3 bg-gray-200 rounded w-2/3 mb-3"></div>
        <div class="v2-stat-skeleton-value h-6 bg-gray-200 rounded w-1/2"></div>
      </div>
      <div class="v2-stat-card v2-stat-skeleton animate-pulse bg-white rounded-xl border border-gray-100 p-4">
        <div class="v2-stat-skeleton-label h-3 bg-gray-200 rounded w-2/3 mb-3"></div>
        <div class="v2-stat-skeleton-value h-6 bg-gray-200 rounded w-1/2"></div>
      </div>
      <div class="v2-stat-card v2-stat-skeleton animate-pulse bg-white rounded-xl border border-gray-100 p-4">
        <div class="v2-stat-skeleton-label h-3 bg-gray-200 rounded w-2/3 mb-3"></div>
        <div class="v2-stat-skeleton-value h-6 bg-gray-200 rounded w-1/2"></div>
      </div>
    </div>

    <!-- 검색 + 필터 -->
    <div class="v2-search mx-4 mt-4">
      <svg class="v2-search__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input type="text" id="search-input" placeholder="고객명으로 검색..."
        class="w-full h-11 px-4 border-2 border-gray-200 rounded-xl text-sm focus:border-primary focus:outline-none bg-white"
        oninput="filterEstimates()">
      <button type="button" id="search-clear" class="v2-search-clear is-hidden" onclick="clearSearch()" aria-label="검색어 지우기">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7l10 10M17 7 7 17"></path></svg>
      </button>
    </div>
    <div class="mx-4 mt-3 flex gap-2 overflow-x-auto pb-1" id="status-tabs">
      <button onclick="setFilter('전체')" data-status="전체"
        class="status-tab is-active flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-primary text-white">전체 <span class="status-count">0</span></button>
      <button onclick="setFilter('상담완료')" data-status="상담완료"
        class="status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">상담완료 <span class="status-count">0</span></button>
      <button onclick="setFilter('계약')" data-status="계약"
        class="status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">계약 <span class="status-count">0</span></button>
      <button onclick="setFilter('시공중')" data-status="시공중"
        class="status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">시공중 <span class="status-count">0</span></button>
      <button onclick="setFilter('시공완료')" data-status="시공완료"
        class="status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">시공완료 <span class="status-count">0</span></button>
      <button onclick="setFilter('후속필요')" data-status="후속필요"
        class="status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">후속 필요 <span class="status-count">0</span></button>
    </div>

    <!-- 견적 목록 -->
    <div class="v2-estimate-list mx-4 mt-3" id="estimate-list"></div>
  </main>

  <!-- Scripts -->
  <script src="/js/api.js?v=74"></script>
  <script src="/js/auth.js?v=74"></script>
  <script src="/js/ui.js?v=74"></script>
  <script src="/js/calc.js?v=74"></script>
  <script src="/js/estimate.js?v=74"></script>
  <script>
    let allEstimates = [];
    let currentFilter = '전체';
    let expandedId = null;
    const STATUSES = ['상담완료', '계약', '시공중', '시공완료'];

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.guard()) {
        window.addEventListener('yr-authenticated', init);
        return;
      }
      init();
    });

    async function init() {
      UI.renderTabBar('dashboard');
      document.getElementById('estimate-list').innerHTML = UI.skeleton(3);
      await loadEstimates();
      await loadDashboard();
    }

    // --- 통계 (stale-while-revalidate) ---
    const DASH_STATS_TTL = 2 * 60 * 1000;

    async function loadDashboard() {
      try {
        const cached = localStorage.getItem('yr_dashboard_cache');
        if (cached) renderStats(JSON.parse(cached));
      } catch {}

      const cacheTs = Number(localStorage.getItem('yr_dashboard_cache_ts')) || 0;
      if (Date.now() - cacheTs < DASH_STATS_TTL) return;

      try {
        const data = await API.getDashboard();
        renderStats(data);
        localStorage.setItem('yr_dashboard_cache', JSON.stringify(data));
        localStorage.setItem('yr_dashboard_cache_ts', String(Date.now()));
      } catch {
        if (!localStorage.getItem('yr_dashboard_cache')) {
          renderStats({});
        }
      }
    }

    function renderStats(data) {
      const count = data.count || 0;
      // 총액을 items에서 재계산 (D/C 총액 기준 반영)
      let total = 0;
      if (allEstimates.length > 0) {
        const now = new Date();
        const thisMonth = allEstimates.filter(e => {
          const d = new Date(e.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
        total = thisMonth.reduce((sum, e) => {
          const r = Estimate.calcTotals(e);
          return sum + (r.total || e.total || 0);
        }, 0);
      } else {
        total = data.totalAmount || 0;
      }
      const conversion = count > 0 ? Math.round((data.contracted || 0) / count * 100) : 0;
      const compactTotal = formatCompactParts(total);
      document.getElementById('stat-cards').innerHTML = `
        <div class="v2-stat-card bg-white rounded-xl border border-gray-100 p-3 text-center">
          <p class="v2-stat-label text-[11px] text-gray-400 mb-0.5">이번 달</p>
          <p class="v2-stat-value text-xl font-extrabold text-primary">${count}<span class="v2-stat-unit text-xs font-bold">건</span></p>
        </div>
        <div class="v2-stat-card bg-white rounded-xl border border-gray-100 p-3 text-center">
          <p class="v2-stat-label text-[11px] text-gray-400 mb-0.5">총액</p>
          <p class="v2-stat-value text-lg font-extrabold text-accent">${compactTotal.value}<span class="v2-stat-unit">${compactTotal.unit}</span></p>
        </div>
        <div class="v2-stat-card bg-white rounded-xl border border-gray-100 p-3 text-center">
          <p class="v2-stat-label text-[11px] text-gray-400 mb-0.5">계약률</p>
          <p class="v2-stat-value text-xl font-extrabold text-primary">${conversion}<span class="v2-stat-unit text-xs font-bold">%</span></p>
        </div>`;
    }

    function formatCompact(n) {
      if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
      if (n >= 10000) return (n / 10000).toFixed(0) + '만';
      return UI.formatCurrency(n);
    }

    function formatCompactParts(n) {
      const compact = formatCompact(n);
      const match = compact.match(/^(.*?)(억|만|원)$/);
      return match ? { value: match[1], unit: match[2] } : { value: compact, unit: '' };
    }

    // --- 견적 목록 (stale-while-revalidate) ---
    const DASH_EST_TTL = 2 * 60 * 1000; // 2분

    async function loadEstimates() {
      // 1. 캐시된 데이터 즉시 표시
      try {
        const cached = localStorage.getItem('yr_estimates_cache');
        if (cached) {
          allEstimates = JSON.parse(cached);
          if (Array.isArray(allEstimates) && allEstimates.length) renderList();
          else if (allEstimates.estimates) { allEstimates = allEstimates.estimates; renderList(); }
        }
      } catch {}

      const cacheTs = Number(localStorage.getItem('yr_estimates_cache_ts')) || 0;
      if (Date.now() - cacheTs < DASH_EST_TTL && allEstimates.length > 0) return;

      // 2. 서버에서 최신 데이터 가져오기
      try {
        const data = await API.getEstimates();
        allEstimates = (data && data.estimates) ? data.estimates : [];
        localStorage.setItem('yr_estimates_cache', JSON.stringify(allEstimates));
        localStorage.setItem('yr_estimates_cache_ts', String(Date.now()));
        renderList();
      } catch {
        if (!allEstimates.length) {
          document.getElementById('estimate-list').innerHTML = UI.empty(
            '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5m0 4h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>',
            '데이터를 불러올 수 없습니다.',
            '네트워크 상태를 확인한 뒤 다시 시도해주세요.',
            '다시 시도',
            '',
            'loadEstimates()'
          );
        }
      }
    }

    function setFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.status-tab').forEach(btn => {
        const isActive = btn.dataset.status === status;
        btn.className = `status-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold ${isActive ? 'is-active bg-primary text-white' : 'bg-gray-100 text-gray-500'}`;
        btn.setAttribute('aria-pressed', String(isActive));
      });
      renderList();
    }

    function filterEstimates() {
      const input = document.getElementById('search-input');
      const clearButton = document.getElementById('search-clear');
      if (clearButton) clearButton.classList.toggle('is-hidden', !input.value);
      renderList();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      input.focus();
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function getOverdueDays(e) {
      var ref = e.statusChangedAt || e.date;
      if (!ref) return 0;
      var d = new Date(ref);
      if (isNaN(d.getTime())) return 0;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    }

    function overdueBadge(e) {
      if (e.status === '시공완료') return '';
      var days = getOverdueDays(e);
      if (days >= 7) return '<span class="v2-overdue ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-600">' + days + '일 경과</span>';
      if (days >= 3) return '<span class="v2-overdue ml-1.5 px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-600">' + days + '일 경과</span>';
      return '';
    }

    function updateFilterCounts() {
      const counts = {
        '전체': allEstimates.length,
        '상담완료': allEstimates.filter(e => e.status === '상담완료').length,
        '계약': allEstimates.filter(e => e.status === '계약').length,
        '시공중': allEstimates.filter(e => e.status === '시공중').length,
        '시공완료': allEstimates.filter(e => e.status === '시공완료').length,
        '후속필요': allEstimates.filter(e => e.status !== '시공완료' && getOverdueDays(e) >= 3).length,
      };
      document.querySelectorAll('.status-tab').forEach(btn => {
        const count = counts[btn.dataset.status] || 0;
        const countNode = btn.querySelector('.status-count');
        if (countNode) countNode.textContent = count;
      });
    }

    function getFiltered() {
      const query = (document.getElementById('search-input').value || '').trim().toLowerCase();
      return allEstimates.filter(e => {
        if (currentFilter === '후속필요') {
          return e.status !== '시공완료' && getOverdueDays(e) >= 3 &&
            (!query || (e.customerName || '').toLowerCase().includes(query));
        }
        const matchStatus = currentFilter === '전체' || e.status === currentFilter;
        const matchSearch = !query || (e.customerName || '').toLowerCase().includes(query);
        return matchStatus && matchSearch;
      });
    }

    function renderList() {
      const list = getFiltered();
      const container = document.getElementById('estimate-list');
      updateFilterCounts();

      if (allEstimates.length === 0) {
        container.innerHTML = UI.empty('<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h10v3h3v15H4V6h3zM8 11h8m-8 4h8"/></svg>', '아직 견적이 없습니다', '첫 견적을 만들어보세요!', '새 견적 작성', 'index.html');
        return;
      }
      if (list.length === 0) {
        container.innerHTML = UI.empty(
          '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4M8.5 11h5"></path></svg>',
          '검색 결과가 없습니다.',
          '다른 고객명을 입력하거나 검색어를 지워보세요.',
          '검색어 지우기',
          '',
          'clearSearch()'
        );
        return;
      }
      container.innerHTML = list.map(e => renderCard(e)).join('');
    }

    function renderCard(e) {
      const isExpanded = expandedId === e.estimateId;
      const recalc = Estimate.calcTotals(e);
      const displayTotal = recalc.total || e.total || 0;
      return `
        <div class="v2-estimate-card ${isExpanded ? 'is-expanded' : ''} bg-white rounded-xl border-0 border-[#2F6BFF] mb-3 overflow-hidden" data-estimate-id="${e.estimateId}">
          <div class="v2-estimate-card__summary p-4 cursor-pointer active:bg-gray-50" role="button" tabindex="0" aria-expanded="${isExpanded}" onclick="toggleExpand('${e.estimateId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleExpand('${e.estimateId}')}" >
            <div class="v2-card-grid flex items-center justify-between gap-3">
              <div class="v2-card-main flex-1 min-w-0">
                <div class="v2-card-head flex items-center gap-2 mb-0.5">
                  <span class="v2-card-name text-sm font-bold text-gray-800">${e.customerName || '미지정'}</span>
                </div>
                <div class="v2-card-status">${UI.statusBadge(e.status || '상담완료')}${overdueBadge(e)}</div>
                <p class="v2-card-meta text-xs text-gray-400">${UI.formatDate(e.date || '')} · ${e.itemSummary || '랙'} · ${e.totalQuantity || 0}대</p>
              </div>
              <div class="v2-card-side text-right flex-shrink-0 ml-3">
                <p class="v2-card-money v2-money text-sm font-bold text-primary">${UI.formatCurrency(displayTotal)}</p>
                <div class="v2-card-controls">
                  <button type='button' onclick='event.stopPropagation();shareEstimate(&quot;${e.estimateId}&quot;)' onkeydown='event.stopPropagation()'
                    class='v2-card-quick-share ml-auto h-10 px-3 border border-gray-800 bg-white text-gray-800 text-base font-semibold'>보내기</button>
                  <span class="v2-card-arrow text-gray-300 text-xs" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg></span>
                </div>
              </div>
            </div>
          </div>
          <div class="v2-detail-collapse ${isExpanded ? 'is-open' : ''}" aria-hidden="${!isExpanded}">
            <div class="v2-detail-collapse__inner" ${isExpanded ? '' : 'inert'}>${renderDetail(e)}</div>
          </div>
        </div>`;
    }

    function renderDetail(e) {
      const currentStatus = e.status || '상담완료';
      let items = e.items || [];
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch { items = []; } }

      const itemsHtml = items.map(item => {
        const isCustom = item.itemType === 'custom';
        const qty = Number(item.quantity) || (isCustom ? 1 : 0);
        const uPrice = Number(item.unitPrice) || 0;
        const iFee = Number(item.installFee) || 0;
        const unitAmount = isCustom ? uPrice : uPrice + iFee;
        const amount = unitAmount * qty;
        const name = isCustom ? item.name : `${item.type}${item.form ? '(' + item.form + ')' : ''} ${item.spec}${item.tier ? '*' + item.tier + 's' : ''}`;
        return `<div class="v2-item-row ${amount < 0 ? 'is-negative' : ''}">
          <div class="v2-item-main">
            <span class="v2-item-name">${name}</span>
            <span class="v2-item-amount">${UI.formatCurrency(amount)}</span>
          </div>
          <p class="v2-item-meta">@${UI.formatCurrency(unitAmount)} × ${qty}</p>
        </div>`;
      }).join('');

      const contactRow = (label, value, isPhone = false) => {
        const display = value ? UI.escapeHtml(value) : '미입력';
        const valueClass = value ? 'v2-contact-value' : 'v2-contact-value is-missing';
        if (isPhone && value) {
          const tel = String(value).replace(/[^\d+]/g, '');
          return `<div><span class="v2-contact-label">${label}</span><a class="${valueClass} v2-contact-phone" href="tel:${tel}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h3l1.5 4-2 1.5a15 15 0 0 0 6 6l1.5-2 4 1.5v3a3 3 0 0 1-3 3C10.3 20 4 13.7 4 6a3 3 0 0 1 3-3Z"></path></svg>${display}</a></div>`;
        }
        return `<div><span class="v2-contact-label">${label}</span><span class="${valueClass}">${display}</span></div>`;
      };

      return `
        <div class="v2-estimate-detail border-t border-gray-100 px-4 py-3 bg-gray-50">
          <div class="v2-contact-list grid grid-cols-2 gap-2 text-xs mb-3">
            ${contactRow('회사명', e.company)}
            ${contactRow('연락처', e.phone, true)}
            ${contactRow('현장 주소', e.address)}
          </div>
          ${items.length > 0 ? `<div class="v2-item-list mb-3"><p class="v2-item-title text-xs font-bold text-gray-500 mb-1">품목 내역</p>${itemsHtml}</div>` : ''}
          <!-- 액션 버튼 -->
          <div class="v2-detail-actions flex gap-2 mb-3">
            <button onclick="shareEstimate('${e.estimateId}')"
              class="v2-action-share flex-1 h-9 bg-accent text-white rounded-lg font-bold text-xs flex items-center justify-center gap-1 active:scale-[0.98] transition-transform">공유하기</button>
            <a href="estimate-preview.html?id=${e.estimateId}"
              class="v2-action-preview flex-1 h-9 bg-primary text-white rounded-lg font-bold text-xs flex items-center justify-center gap-1 active:scale-[0.98] transition-transform">미리보기</a>
            <a href="index.html?from=edit&editId=${e.estimateId}"
              class="v2-action-edit flex-1 h-9 bg-gray-600 text-white rounded-lg font-bold text-xs flex items-center justify-center gap-1 active:scale-[0.98] transition-transform">수정</a>
            <button onclick="handleDeleteEstimate('${e.estimateId}')"
              class="v2-danger-action w-9 h-9 flex items-center justify-center rounded-lg bg-red-50 text-red-400 active:bg-red-100 shrink-0" aria-label="삭제">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
          <div>
            <p class="v2-status-title text-xs font-bold text-gray-500 mb-2">상태 변경</p>
            <div class="v2-status-grid flex gap-2 flex-wrap">
              ${STATUSES.map(s => `
                <button onclick="changeStatus('${e.estimateId}', '${s}')"
                  class="px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${s === currentStatus ? 'is-current bg-primary text-white' : 'bg-gray-100 text-gray-500 active:bg-gray-200'}" aria-pressed="${s === currentStatus}">${s}</button>
              `).join('')}
            </div>
          </div>
        </div>`;
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      document.querySelectorAll('.v2-estimate-card').forEach(card => {
        const isExpanded = card.dataset.estimateId === expandedId;
        card.classList.toggle('is-expanded', isExpanded);
        const summary = card.querySelector('.v2-estimate-card__summary');
        const collapse = card.querySelector('.v2-detail-collapse');
        const inner = card.querySelector('.v2-detail-collapse__inner');
        if (summary) summary.setAttribute('aria-expanded', String(isExpanded));
        if (collapse) {
          collapse.classList.toggle('is-open', isExpanded);
          collapse.setAttribute('aria-hidden', String(!isExpanded));
        }
        if (inner) inner.inert = !isExpanded;
      });
    }

    function shareEstimate(estimateId) {
      const e = allEstimates.find(est => est.estimateId === estimateId);
      if (e) Estimate.share(e, 'formal');
    }

    function handleDeleteEstimate(estimateId) {
      UI.confirm('견적 삭제', '이 견적을 삭제하시겠습니까?', async () => {
        document.getElementById('page-loading').classList.remove('hidden');
        document.getElementById('loading-text').textContent = '견적 삭제 중...';
        try {
          const res = await API.deleteEstimate(estimateId);
          if (res && res.error) {
            UI.toast('삭제 실패: ' + res.error, 'error');
          } else {
            allEstimates = allEstimates.filter(e => e.estimateId !== estimateId);
            UI.toast('삭제되었습니다', 'success');
            renderList();
          }
        } catch (err) {
          UI.toast('삭제 실패: ' + (err.message || ''), 'error');
        } finally {
          document.getElementById('page-loading').classList.add('hidden');
        }
      });
    }

    function changeStatus(estimateId, newStatus) {
      const item = allEstimates.find(e => e.estimateId === estimateId);
      if (item && (item.status || '상담완료') === newStatus) return;
      UI.confirm('상태 변경', `'${newStatus}' 상태로 변경하시겠습니까?`, () => applyStatusChange(estimateId, newStatus));
    }

    async function applyStatusChange(estimateId, newStatus) {
      try {
        await API.updateStatus(estimateId, newStatus);
        const item = allEstimates.find(e => e.estimateId === estimateId);
        if (item) {
          item.status = newStatus;
          item.statusChangedAt = new Date().toISOString();
        }
        UI.toast(`상태가 '${newStatus}'로 변경되었습니다`, 'success');
        renderList();
        requestAnimationFrame(() => {
          const card = Array.from(document.querySelectorAll('.v2-estimate-card')).find(node => node.dataset.estimateId === estimateId);
          if (!card) return;
          card.classList.add('is-status-highlighted');
          setTimeout(() => card.classList.remove('is-status-highlighted'), 300);
        });

        // 계약 시 거래명세표 자동 안내
        if (newStatus === '계약') {
          setTimeout(() => {
            UI.confirm(
              '거래명세표 확인',
              '계약이 확정되었습니다. 거래명세표를 확인하시겠습니까?',
              () => { window.location.href = `estimate-preview.html?id=${estimateId}&doc=transaction`; }
            );
          }, 300);
        }
      } catch { UI.toast('상태 변경 실패', 'error'); }
    }
  </script>

  <script src="/js/sw-register.js"></script>
<script>(function(){function go(){var r=document.querySelector('#status-tabs');if(r&&typeof UI!=='undefined'&&UI.enhanceScrollRow)UI.enhanceScrollRow(r);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',go);}else{go();}setTimeout(go,800);setTimeout(go,2500);})();</script>
</body>
</html>
