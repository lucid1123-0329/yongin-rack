<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>견적 요청 확인 - 중용</title>
  <meta name="description" content="고객 견적 요청 확인">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2F6BFF', accent: '#FF6B00' },
        fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/css/design.css?v=79">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">

  <style>:root{--bg:#F2F4F6;--canvas:#F2F4F6;--surface:#FFFFFF;--fill:#F2F4F6;--fill-2:#E5E8EB;--line:#EEF0F2;--rule:#EEF0F2;--text:#191F28;--ink:#191F28;--text-2:#4E5968;--ink-2:#4E5968;--text-3:#8B95A1;--brand:#2F6BFF;--brand-weak:#E8F0FF;--accent:#FF6B00;--ok:#1FA36B;--ok-weak:#E6F7EF;--danger:#F04452;--danger-weak:#FEECEE;--r-card:20px;--r-ctl:14px;--r-chip:999px;--r-sheet:24px;--shadow-card:0 2px 12px rgba(25,31,40,.06);--s1:8px;--s2:12px;--s3:16px;--s4:20px;--s5:24px;--s6:32px}body { font-family: 'Pretendard', sans-serif; padding-bottom: 80px; }</style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="/js/onesignal-init.js?v=79" defer></script>
  <script src="/js/version-check.js" defer></script>
</head>
<body class="yr-admin-app bg-[#f7fafc] min-h-screen">
  <header class="bg-primary text-white px-4 py-4 sticky top-0 z-40">
    <h1 class="text-lg font-bold">견적 요청</h1>
  </header>

  <main class="max-w-lg mx-auto">
    <!-- 상태 필터 -->
    <div id="req-tabs" class="mx-4 mt-4 flex gap-2 overflow-x-auto pb-1">
      <button onclick="setFilter('전체')" data-status="전체"
        class="req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-primary text-white">전체</button>
      <button onclick="setFilter('미처리')" data-status="미처리"
        class="req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">미처리</button>
      <button onclick="setFilter('연락완료')" data-status="연락완료"
        class="req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">연락완료</button>
      <button onclick="setFilter('견적발송')" data-status="견적발송"
        class="req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">견적발송</button>
      <button onclick="setFilter('완료')" data-status="완료"
        class="req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500">완료</button>
    </div>

    <p id="request-summary" class="v2-request-summary mx-4 mt-3" aria-live="polite">미처리 0건 · 전체 0건</p>
    <div class="mx-4 mt-3" id="request-list"></div>
  </main>

  <!-- Scripts -->
  <script src="/js/api.js?v=79"></script>
  <script src="/js/auth.js?v=79"></script>
  <script src="/js/ui.js?v=79"></script>
  <script>
    let allRequests = [];
    let currentFilter = '전체';
    const REQ_STATUSES = ['미처리', '연락완료', '견적발송', '완료'];

    document.addEventListener('DOMContentLoaded', () => {
      bindCallReturnRestore();
      if (!Auth.guard()) {
        window.addEventListener('yr-authenticated', init);
        return;
      }
      init();
    });

    let pollTimer = null;

    async function init() {
      UI.renderTabBar('requests');
      UI.updateRequestBadge(0);
      document.getElementById('request-list').innerHTML = UI.skeleton(3);
      await loadRequests();
      restoreCalledRequestPosition();
      startPolling();
    }

    async function loadRequests() {
      const viewState = allRequests.length > 0 ? captureRequestViewState() : null;
      // 1. 캐시된 데이터 즉시 표시 (첫 로드 시만)
      if (allRequests.length === 0) {
        try {
          const cached = localStorage.getItem('yr_requests_cache');
          if (cached) {
            allRequests = JSON.parse(cached).requests || [];
            renderRequests(viewState);
          }
        } catch {}
      }

      // 2. 서버에서 최신 데이터
      try {
        const data = await API.getRequests();
        allRequests = (data && data.requests) ? data.requests : [];
        localStorage.setItem('yr_requests_cache', JSON.stringify({ requests: allRequests }));
        renderRequests(viewState);
        UI.markRequestsSeen(allRequests.length);
      } catch (err) {
        if (allRequests.length > 0) return;
        document.getElementById('request-list').innerHTML = UI.empty(
          '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg>', '로딩 실패', err.message || '요청을 불러올 수 없습니다', '다시 시도', 'requests.html'
        );
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadRequests, 60000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearInterval(pollTimer); pollTimer = null;
        } else {
          loadRequests();
          pollTimer = setInterval(loadRequests, 60000);
        }
      });
    }

    function setFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.req-tab').forEach(btn => {
        const isActive = btn.dataset.status === status;
        btn.className = `req-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold ${isActive ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'}`;
      });
      renderRequests();
    }

    function getFiltered() {
      if (currentFilter === '전체') return allRequests;
      return allRequests.filter(r => (r.status || '미처리').includes(currentFilter));
    }

    function prioritizeUnhandled(requests) {
      return requests.slice().sort((a, b) => {
        const aUnhandled = (a.status || '미처리') === '미처리' ? 0 : 1;
        const bUnhandled = (b.status || '미처리') === '미처리' ? 0 : 1;
        return aUnhandled - bUnhandled;
      });
    }

    function formatRequestPhone(value) {
      const original = String(value || '').trim();
      if (!original || /^010-\d{4}-\d{4}$/.test(original)) return original;
      let digits = original.replace(/\D/g, '');
      if (/^10\d{8}$/.test(digits)) digits = '0' + digits;
      if (/^010\d{8}$/.test(digits)) {
        return digits.replace(/^(010)(\d{4})(\d{4})$/, '$1-$2-$3');
      }
      return original;
    }

    function splitRequestStatuses(status) {
      const values = String(status || '미처리').split(',').map(value => value.trim()).filter(Boolean);
      return values.length > 0 ? values : ['미처리'];
    }

    function requestStatusTone(status) {
      return ({
        '미처리': 'is-unhandled',
        '연락완료': 'is-contacted',
        '견적발송': 'is-quoted',
        '완료': 'is-complete',
      })[status] || 'is-complete';
    }

    function renderRequestStatusBadges(status) {
      return splitRequestStatuses(status).map(value =>
        `<span class="v2-request-status-badge ${requestStatusTone(value)}">${UI.escapeHtml(value)}</span>`
      ).join('');
    }

    function requestValue(value) {
      return UI.escapeHtml(String(value == null ? '' : value));
    }

    function requestJsValue(value) {
      return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n]+/g, ' ');
    }

    function hasRequestValue(value) {
      return value !== null && value !== undefined && String(value).trim() !== '';
    }

    function formatRackRequest(r) {
      const values = [];
      if (hasRequestValue(r.rackType)) values.push(String(r.rackType).trim());
      if (hasRequestValue(r.quantity) && Number(r.quantity) > 0) values.push(Number(r.quantity) + '대');
      return values.join(' · ');
    }

    function formatSpaceSize(r) {
      if (!hasRequestValue(r.spaceWidth) && !hasRequestValue(r.spaceDepth) && !hasRequestValue(r.spaceHeight)) return '';
      return `가로 ${hasRequestValue(r.spaceWidth) ? r.spaceWidth : '-'}m × 세로 ${hasRequestValue(r.spaceDepth) ? r.spaceDepth : '-'}m × 높이 ${hasRequestValue(r.spaceHeight) ? r.spaceHeight : '-'}m`;
    }

    function getPhotoUrls(photoUrls) {
      const values = Array.isArray(photoUrls) ? photoUrls : String(photoUrls || '').split(',');
      return values.map(url => String(url).trim()).filter(Boolean);
    }

    function renderPhotoGrid(photoUrls) {
      const photos = getPhotoUrls(photoUrls);
      if (photos.length === 0) return '';
      return `<div class="v2-request-content-row v2-request-photo-row">
        <span class="v2-request-row-label">현장 사진</span>
        <div class="v2-request-photo-grid">
          ${photos.map(function(url) {
            const id = url.match(/[/=]([a-zA-Z0-9_-]{20,})/);
            const thumbUrl = id ? 'https://lh3.googleusercontent.com/d/' + id[1] : url;
            return `<a href="${requestValue(url)}" target="_blank" rel="noopener noreferrer" class="v2-request-photo-link">
              <img src="${requestValue(thumbUrl)}" alt="현장 사진" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
              <span class="v2-request-photo-fallback" hidden>사진 보기</span>
            </a>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContactRow(label, value, className) {
      if (!hasRequestValue(value)) return '';
      return `<div class="v2-request-contact-row ${className || ''}"><span class="v2-request-row-label">${label}</span><span class="v2-request-row-value">${requestValue(value)}</span></div>`;
    }

    function captureRequestViewState() {
      const openDetails = Array.from(document.querySelectorAll('.v2-request-detail:not(.hidden)')).map(el => el.id);
      return { scrollY: window.scrollY || 0, openDetails };
    }

    function restoreRequestViewState(state) {
      if (!state) return;
      requestAnimationFrame(() => {
        document.querySelectorAll('.v2-request-detail').forEach(el => el.classList.toggle('hidden', !state.openDetails.includes(el.id)));
        window.scrollTo(0, state.scrollY);
      });
    }

    function updateRequestCounts() {
      const total = allRequests.length;
      const unhandled = allRequests.filter(r => splitRequestStatuses(r.status).includes('미처리')).length;
      const summary = document.getElementById('request-summary');
      if (summary) summary.textContent = `미처리 ${unhandled}건 · 전체 ${total}건`;
      document.querySelectorAll('.req-tab').forEach(button => {
        const status = button.dataset.status;
        const count = status === '전체' ? total : allRequests.filter(r => splitRequestStatuses(r.status).includes(status)).length;
        button.innerHTML = `${status} <span class="req-tab-count">${count}</span>`;
      });
    }

    function renderRequests(viewState) {
      const container = document.getElementById('request-list');
      const filtered = prioritizeUnhandled(getFiltered());
      updateRequestCounts();

      if (allRequests.length === 0) {
        container.innerHTML = UI.empty('<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 7l9 7 9-7"/></svg>', '요청이 없습니다', '고객의 견적 요청이 여기에 표시됩니다');
        restoreRequestViewState(viewState);
        return;
      }
      if (filtered.length === 0) {
        container.innerHTML = UI.empty('<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>', '해당 상태의 요청이 없습니다.', '다른 상태 필터를 선택해 주세요');
        restoreRequestViewState(viewState);
        return;
      }

      container.innerHTML = filtered.map(r => {
        const rawPhone = String(r.phone || '');
        const phone = rawPhone.replace(/^0?(\d+)/, (m, p) => {
          if (m.startsWith('0')) return m;
          return '0' + m;
        });
        const phoneDisplay = formatRequestPhone(rawPhone);
        const statuses = splitRequestStatuses(r.status);
        const dateStr = r.date ? UI.formatDate(r.date) : '';
        const bizInfo = [r.bizNumber, r.bizType, r.bizItem].filter(hasRequestValue).join(' · ');
        const rackRequest = formatRackRequest(r);
        const spaceSize = formatSpaceSize(r);
        const cargo = [r.cargoType, r.cargoWeight].filter(hasRequestValue).join(' · ');
        const contentRows = [
          rackRequest ? `<div class="v2-request-content-row"><span class="v2-request-row-label">요청 랙</span><span class="v2-request-row-value">${requestValue(rackRequest)}</span></div>` : '',
          hasRequestValue(r.memo) ? `<div class="v2-request-content-row"><span class="v2-request-row-label">메모</span><span class="v2-request-row-value v2-request-memo">${requestValue(r.memo)}</span></div>` : '',
          spaceSize ? `<div class="v2-request-content-row"><span class="v2-request-row-label">현장 크기</span><span class="v2-request-row-value">${requestValue(spaceSize)}</span></div>` : '',
          hasRequestValue(r.spacePurpose) ? `<div class="v2-request-content-row"><span class="v2-request-row-label">용도</span><span class="v2-request-row-value">${requestValue(r.spacePurpose)}</span></div>` : '',
          cargo ? `<div class="v2-request-content-row"><span class="v2-request-row-label">보관물</span><span class="v2-request-row-value">${requestValue(cargo)}</span></div>` : '',
          renderPhotoGrid(r.photoUrls),
        ].filter(Boolean);

        // 견적 작성 URL 생성
        const estimateParams = new URLSearchParams({ from: 'request', name: r.name || '', phone: phone, requestRowIndex: r.rowIndex });
        if (r.company) estimateParams.set('company', r.company);
        if (r.address) estimateParams.set('address', r.address);
        if (r.bizNumber) estimateParams.set('bizNumber', r.bizNumber);
        if (r.bizType) estimateParams.set('bizType', r.bizType);
        if (r.bizItem) estimateParams.set('bizItem', r.bizItem);

        return `
        <span data-request-row='${r.rowIndex}' class='request-scroll-anchor'></span>
        <article class="request-card bg-white rounded-xl border-0 border-[#2F6BFF] p-4 mb-3" data-row-index="${r.rowIndex}">
          <div class="v2-request-head flex items-center justify-between gap-3 mb-2">
            <div class="v2-request-identity flex items-center gap-2">
              <span class="v2-request-name text-sm font-bold text-gray-800">${requestValue(r.name || '미지정')}</span>
              <span class="v2-request-status">${renderRequestStatusBadges(r.status)}</span>
            </div>
            <span class="v2-request-date text-xs text-gray-400">${requestValue(dateStr)}</span>
          </div>
          <section class="v2-request-contact" aria-label="연락 정보">
            <div class="v2-request-contact-row v2-request-phone-row">
              <span class="v2-request-row-label">전화</span>
              ${hasRequestValue(rawPhone) ? `<a class="v2-request-row-value v2-request-phone" href="tel:${requestValue(rawPhone)}" onclick="handleCall(${r.rowIndex}, '${requestJsValue(r.status || '미처리')}')">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h3l1.5 4-2 1.5a15 15 0 0 0 6 6l1.5-2 4 1.5v3a3 3 0 0 1-3 3C10.3 20 4 13.7 4 6a3 3 0 0 1 3-3Z"></path></svg>${requestValue(phoneDisplay)}</a>` : '<span class="v2-request-row-value">-</span>'}
            </div>
            ${renderContactRow('회사', r.company, 'v2-request-company')}
            ${renderContactRow('현장 주소', r.address, 'v2-request-address')}
            ${renderContactRow('사업자', bizInfo, 'v2-request-biz')}
          </section>
          <section class="v2-request-customer-content" aria-label="고객이 남긴 내용">
            <h3>고객이 남긴 내용</h3>
            <button onclick="toggleDetail(${r.rowIndex})" class="hidden" aria-hidden="true" tabindex="-1">
              <span id="detail-arrow-${r.rowIndex}"><svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span> 상세 정보
            </button>
            <div id="detail-${r.rowIndex}" class="v2-request-detail">
              ${contentRows.length > 0 ? contentRows.join('') : '<p class="v2-request-content-empty">남긴 내용이 없습니다</p>'}
            </div>
          </section>
          ${(r.memo && !r.estimateId) || r.aiAnalysis ? `
          <div class="v2-request-ai">
            <button onclick="aiAnalyzeRequest(${r.rowIndex})" id="btn-ai-${r.rowIndex}"
              ${pendingAnalyses.has(r.requestKey) ? 'disabled' : ''}
              class="v2-ai-button w-full h-9 bg-purple-50 border border-purple-200 text-purple-700 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 active:scale-[0.98]">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
              ${pendingAnalyses.has(r.requestKey) ? '분석 및 저장 중...' : r.aiAnalysis ? 'AI 다시 분석' : 'AI 분석'}
            </button>
            <div id="ai-result-${r.rowIndex}" class="${r.aiAnalysis ? '' : 'hidden'} mt-2">${r.aiAnalysis ? renderAiResult(r.aiAnalysis.result, r) : ''}</div>
          </div>
          ` : ''}
          <!-- 액션 버튼 -->
          <div class="v2-request-actions flex gap-2 mb-3">
            <a href="tel:${requestValue(rawPhone)}" onclick="handleCall(${r.rowIndex}, '${requestJsValue(r.status || '미처리')}')"
              class="v2-request-call flex-1 h-10 bg-primary text-white rounded-lg text-sm font-bold flex items-center justify-center gap-1.5 active:scale-[0.98]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              전화걸기
            </a>
            ${r.estimateId
              ? `<a href="estimate-preview.html?id=${r.estimateId}"
                  class="v2-request-estimate flex-1 h-10 bg-primary text-white rounded-lg text-sm font-bold flex items-center justify-center gap-1.5 active:scale-[0.98]">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  견적서 확인
                </a>`
              : `<a href="index.html?${estimateParams.toString()}"
                  class="v2-accent-action v2-request-estimate flex-1 h-10 bg-accent text-white rounded-lg text-sm font-bold flex items-center justify-center gap-1.5 active:scale-[0.98]">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                  견적 작성
                </a>`
            }
          </div>
          <div class="v2-request-workflow flex items-center gap-1.5 flex-wrap">
            <button onclick="toggleRequestTag(${r.rowIndex}, '연락완료')"
              class="v2-request-tag px-2.5 py-1 rounded-full text-[11px] font-bold transition-colors ${statuses.includes('연락완료') ? 'is-selected' : ''}" aria-pressed="${statuses.includes('연락완료')}">연락완료</button>
            <button onclick="toggleRequestTag(${r.rowIndex}, '견적발송')"
              class="v2-request-tag px-2.5 py-1 rounded-full text-[11px] font-bold transition-colors ${statuses.includes('견적발송') ? 'is-selected' : ''}" aria-pressed="${statuses.includes('견적발송')}">견적발송</button>
            <button onclick="changeRequestStatus(${r.rowIndex}, '완료')"
              class="v2-request-tag px-2.5 py-1 rounded-full text-[11px] font-bold transition-colors ${statuses.includes('완료') ? 'is-selected' : ''}" aria-pressed="${statuses.includes('완료')}">완료</button>
            <button onclick="handleDeleteRequest(${r.rowIndex})"
              class="v2-request-delete ml-auto w-7 h-7 flex items-center justify-center rounded-lg text-red-400 active:bg-red-50">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </article>`;
      }).join('');
      restoreRequestViewState(viewState);
    }

    function handleDeleteRequest(rowIndex) {
      UI.confirm('요청 삭제', '이 요청을 삭제하시겠습니까?', async () => {
        try {
          await API.deleteRequest(rowIndex);
          UI.toast('삭제되었습니다', 'success');
          await loadRequests();
        } catch { UI.toast('삭제 실패', 'error'); }
      });
    }

    function handleCall(rowIndex, currentStatus) {
      sessionStorage.setItem('yr_called_request_row', String(rowIndex));
      // 미처리 → 연락완료 자동 전환
      if (currentStatus === '미처리') {
        changeRequestStatus(rowIndex, '연락완료');
      } else if (!currentStatus.includes('연락완료')) {
        toggleRequestTag(rowIndex, '연락완료');
      }
    }

    function bindCallReturnRestore() {
      window.addEventListener('pageshow', () => setTimeout(restoreCalledRequestPosition, 100));
      window.addEventListener('focus', () => setTimeout(restoreCalledRequestPosition, 100));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) setTimeout(restoreCalledRequestPosition, 100);
      });
    }

    function restoreCalledRequestPosition() {
      const stored = sessionStorage.getItem('yr_called_request_row');
      const rowIndex = Number(stored);
      if (!stored || !Number.isFinite(rowIndex)) return;
      const scrollToCard = () => {
        const anchor = document.querySelector('[data-request-row=\'' + rowIndex + '\']');
        if (anchor) anchor.scrollIntoView({ block: 'start', behavior: 'auto' });
        return Boolean(anchor);
      };
      if (!scrollToCard()) return;
      setTimeout(() => {
        scrollToCard();
        sessionStorage.removeItem('yr_called_request_row');
      }, 300);
    }

    async function toggleRequestTag(rowIndex, tag) {
      const item = allRequests.find(r => r.rowIndex === rowIndex);
      if (!item) return;
      const current = item.status || '미처리';
      const tags = current.split(',').map(s => s.trim()).filter(Boolean);

      if (tags.includes(tag)) {
        // 이미 있으면 제거
        const newTags = tags.filter(t => t !== tag);
        const newStatus = newTags.length > 0 ? newTags.join(',') : '미처리';
        await changeRequestStatus(rowIndex, newStatus);
      } else {
        // 없으면 추가 (미처리는 제거)
        const newTags = tags.filter(t => t !== '미처리');
        newTags.push(tag);
        await changeRequestStatus(rowIndex, newTags.join(','));
      }
    }

    async function changeRequestStatus(rowIndex, newStatus) {
      try {
        await API.updateRequestStatus(rowIndex, newStatus);
        const item = allRequests.find(r => r.rowIndex === rowIndex);
        if (item) item.status = newStatus;
        UI.toast(`'${newStatus}'로 변경되었습니다`, 'success');
        renderRequests();
        UI.markRequestsSeen(allRequests.length);
      } catch { UI.toast('상태 변경 실패', 'error'); }
    }

    // --- 상세 정보 토글 ---
    function hasDetail(r) {
      return r.spaceWidth || r.spaceDepth || r.spaceHeight || r.spacePurpose || r.cargoType || r.cargoWeight || r.photoUrls;
    }

    function toggleDetail(rowIndex) {
      var el = document.getElementById('detail-' + rowIndex);
      var arrow = document.getElementById('detail-arrow-' + rowIndex);
      if (!el) return;
      el.classList.toggle('hidden');
      arrow.innerHTML = el.classList.contains('hidden')
        ? '<svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'
        : '<svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
    }

    // --- AI 분석 ---
    const pendingAnalyses = new Set();
    async function aiAnalyzeRequest(rowIndex) {
      var req = allRequests.find(r => r.rowIndex === rowIndex);
      if (!req) return;
      if (!req.requestKey) { UI.toast('요청 목록을 새로고침한 뒤 다시 시도해주세요.', 'warning'); return; }
      if (pendingAnalyses.has(req.requestKey)) return;
      if (req.aiAnalysis) {
        UI.confirm('AI 다시 분석', '새 분석이 저장되면 이전 결과를 교체합니다. 다시 분석할까요?', () => runRequestAnalysis(req));
        return;
      }
      await runRequestAnalysis(req);
    }

    async function runRequestAnalysis(req) {
      if (pendingAnalyses.has(req.requestKey)) return;
      pendingAnalyses.add(req.requestKey);
      var rowIndex = req.rowIndex;

      var btn = document.getElementById('btn-ai-' + rowIndex);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '분석 및 저장 중...';
      }

      try {
        var result = await API.analyzeRequest({
          requestKey:req.requestKey, reanalyze:!!req.aiAnalysis
        });

        if (result.error) throw new Error(result.error);
        if (!result.savedAnalysis || result.savedAnalysis.requestKey !== req.requestKey) throw new Error('저장이 확인되지 않았습니다. 서버 업데이트를 확인해주세요.');
        var current = allRequests.find(r => r.requestKey === req.requestKey);
        if (current) current.aiAnalysis = result.savedAnalysis;
        try { localStorage.setItem('yr_requests_cache', JSON.stringify({ requests:allRequests })); } catch {}
        renderRequests(captureRequestViewState());
        UI.toast('AI 분석 결과가 저장되었습니다', 'success');
      } catch (e) {
        UI.toast('AI 분석 실패: ' + e.message, 'error');
      } finally {
        pendingAnalyses.delete(req.requestKey);
        var current = allRequests.find(r => r.requestKey === req.requestKey);
        var button = current && document.getElementById('btn-ai-' + current.rowIndex);
        if (button) {
          button.disabled = false;
          button.textContent = current.aiAnalysis ? 'AI 다시 분석' : 'AI 분석';
        }
      }
    }

    function renderAiResult(ai, req) {
      // 원클릭 견적 URL 구성
      var params = new URLSearchParams({
        from: 'ai-analysis',
        name: req.name || '', phone: req.phone || '',
        company: req.company || '', address: req.address || '',
        bizNumber: req.bizNumber || '', bizType: req.bizType || '', bizItem: req.bizItem || '',
        requestRowIndex: req.rowIndex,
        aiType: ai.recommendedType || '', aiForm: ai.recommendedForm || '',
        aiSpec: ai.recommendedSpec || '', aiQty: ai.recommendedQty || ''
      });
      var questionText = String(ai.reasoning || '현장 치수와 설치 조건을 전화로 확인해 주세요.');
      var questions = questionText.split(/\r?\n/).map(function (question) {
        return question.replace(/^[-*•\d.)\s]+/, '').trim();
      }).filter(Boolean);
      if (questions.length === 0) questions.push('현장 치수와 설치 조건을 전화로 확인해 주세요.');

      return `
        <div class="v2-ai-result p-3 bg-purple-50 rounded-lg space-y-2" aria-label="AI 분석 결과">
          ${req.aiAnalysis ? `<p class="v2-ai-saved">저장된 분석 · ${requestValue(new Date(req.aiAnalysis.savedAt).toLocaleString('ko-KR'))}</p>` : ''}
          <section class="v2-ai-summary"><h4>분석 요약</h4><p>${requestValue(ai.analysis || '')}</p></section>
          <section class="v2-ai-questions">
            <h4>전화로 확인할 질문</h4>
            <ul>${questions.map(question => `<li>${requestValue(question)}</li>`).join('')}</ul>
          </section>
          <span class="sr-only">추천 랙: ${requestValue(ai.recommendedType || '-')} ${requestValue(ai.recommendedForm || '')} 규격: ${requestValue(ai.recommendedSpec || '-')} 수량: ${requestValue(ai.recommendedQty || '?')}대 예상 가격: ${requestValue(ai.estimatedPriceRange || '-')}</span>
          <a href="index.html?${params.toString()}"
            class="v2-ai-create block w-full h-9 bg-accent text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1 active:scale-[0.98]">
            원클릭 견적 생성 <span>종류만 반영</span>
          </a>
        </div>`;
    }
  </script>

  <script src="/js/sw-register.js"></script>
<script>(function(){function go(){var r=document.querySelector('#req-tabs');if(r&&typeof UI!=='undefined'&&UI.enhanceScrollRow)UI.enhanceScrollRow(r);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',go);}else{go();}setTimeout(go,800);setTimeout(go,2500);})();</script>
</body>
</html>
