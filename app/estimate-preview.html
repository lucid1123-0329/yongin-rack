<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>견적서 미리보기 - 중용랙</title>
  <meta name="description" content="경량랙, 중량랙, 파렛트랙 맞춤형 최저가 견적을 즉시 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="중용랙 - 견적서 미리보기">
  <meta property="og:description" content="경량랙, 중량랙, 파렛트랙 맞춤형 최저가 견적을 즉시 확인하세요.">
  <meta property="og:image" content="https://yongin-rack.com/assets/og-image.jpg">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2F6BFF', accent: '#FF6B00' }, fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/css/design.css?v=74">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  <style>
    :root{--bg:#F2F4F6;--canvas:#F2F4F6;--surface:#FFFFFF;--fill:#F2F4F6;--fill-2:#E5E8EB;--line:#EEF0F2;--rule:#EEF0F2;--text:#191F28;--ink:#191F28;--text-2:#4E5968;--ink-2:#4E5968;--text-3:#8B95A1;--brand:#2F6BFF;--brand-weak:#E8F0FF;--accent:#FF6B00;--ok:#1FA36B;--ok-weak:#E6F7EF;--danger:#F04452;--danger-weak:#FEECEE;--r-card:20px;--r-ctl:14px;--r-chip:999px;--r-sheet:24px;--shadow-card:0 2px 12px rgba(25,31,40,.06);--s1:8px;--s2:12px;--s3:16px;--s4:20px;--s5:24px;--s6:32px}
    body { font-family: 'Pretendard', sans-serif; padding-bottom: env(safe-area-inset-bottom, 24px); }
    .doc-tab { min-height:48px; padding:8px 16px; border:none; border-radius:999px; background:var(--fill); color:var(--text-2); font-size:15px; font-weight:600; cursor:pointer; }
    .doc-tab.active { background:var(--brand-weak); color:var(--brand); font-weight:700; z-index:1; }
    /* A4 고정 너비 + 모바일 축소 */
    .a4-wrapper { width: 700px; transform-origin: top left; }
    .a4-container { overflow: hidden; }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="/js/onesignal-init.js?v=74" defer></script>
  <script src="/js/version-check.js" defer></script>
</head>
<body class="yr-admin-app bg-[#f7fafc] min-h-screen pb-20">
  <header class="bg-primary text-white px-4 py-4 flex items-center gap-3 sticky top-0 z-40">
    <button onclick="history.back()" class="w-8 h-8 flex items-center justify-center rounded-lg active:bg-white/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h1 class="text-lg font-bold" id="page-title">견적서 미리보기</h1>
  </header>

  <main class="max-w-2xl mx-auto">
    <div id="loading-state" class="mx-4 mt-6">
      <div class="bg-white rounded-2xl border border-gray-100 p-6 animate-pulse">
        <div class="h-5 bg-gray-200 rounded w-1/3 mx-auto mb-4"></div>
        <div class="h-8 bg-gray-200 rounded w-2/3 mx-auto mb-6"></div>
        <div class="space-y-3"><div class="h-4 bg-gray-200 rounded w-full"></div><div class="h-4 bg-gray-200 rounded w-5/6"></div></div>
      </div>
    </div>

    <div id="error-state" class="mx-4 mt-6 hidden">
      <div class="bg-white rounded-2xl border border-red-200 p-6 text-center">
        <p class="text-red-500 font-semibold text-lg mb-2">견적을 불러올 수 없습니다</p>
        <p class="text-gray-500 text-sm mb-4" id="error-message"></p>
        <a href="index.html" class="inline-block px-6 py-2 bg-primary text-white rounded-xl text-sm font-semibold">돌아가기</a>
      </div>
    </div>

    <!-- 문서 타입 전환 탭 -->
    <div id="doc-tabs" class="mx-4 mt-4 hidden flex gap-1 border-b border-gray-300">
      <button class="doc-tab active" data-doc="formal" onclick="switchDoc('formal')">정식 견적서</button>
      <button class="doc-tab" data-doc="simple" onclick="switchDoc('simple')">간편 견적서</button>
      <button class="doc-tab" data-doc="transaction" onclick="switchDoc('transaction')">거래명세표</button>
    </div>

    <!-- 마진 숨기기 토글 -->
    <div id="margin-toggle" class="mx-4 mt-3 hidden">
      <label class="flex items-center gap-3 bg-white rounded-xl border border-gray-100 px-4 py-3 cursor-pointer active:bg-gray-50">
        <input type="checkbox" id="chk-hide-margin" onchange="renderDoc()" class="w-5 h-5 rounded accent-primary">
        <div>
          <span class="text-sm font-bold text-gray-700">마진 단가 적용</span>
          <p class="text-[11px] text-gray-400 mt-0.5">마진을 각 품목 단가에 배분하여 마진 항목을 숨깁니다</p>
        </div>
      </label>
    </div>

    <!-- 미리보기 영역 -->
    <div id="preview-container" class="mx-4 mt-3 hidden a4-container">
      <div id="preview-area" class="a4-wrapper"></div>
    </div>

    <!-- 액션 버튼 -->
    <div id="action-buttons" class="mx-4 mt-6 space-y-3 hidden">
      <button id="btn-share" onclick="handleShare()"
        class="w-full h-14 rounded-2xl font-bold text-base flex items-center justify-center gap-2 active:scale-[0.98] transition-transform bg-[#f97316] text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
        공유하기
      </button>
      <button id="btn-download" onclick="handleDownload()"
        class="w-full h-14 bg-white border-2 border-gray-200 rounded-2xl font-bold text-base text-gray-700 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/></svg>
        이미지 저장
      </button>
      <a href="index.html"
        class="w-full h-14 bg-primary text-white rounded-2xl font-bold text-base flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        새 견적 만들기
      </a>
    </div>
  </main>

  <!-- 기존 공유/저장 동작을 위임하는 빠른 전송 바 -->
  <div id='preview-fixed-actions' class='ux-fixed-bar hidden fixed left-0 right-0 z-50'>
    <div class='max-w-lg mx-auto h-full px-4 flex items-center gap-2'>
      <button id='btn-message-fixed' type='button' onclick='openMessageSheet()'
        class='flex-1 h-12 border-0 bg-[#F2F4F6] text-gray-800 text-base font-semibold'>
        문구 복사
      </button>
      <button id='btn-share-fixed' type='button' onclick='handleShare()'
        class='v2-accent-action flex-[2] h-12 border border-accent bg-accent text-white text-lg font-semibold'>
        카카오톡으로 보내기
      </button>
      <button id='btn-download-fixed' type='button' onclick='document.getElementById(&quot;btn-download&quot;).click()'
        class='flex-1 h-12 border border-gray-800 bg-white text-gray-800 text-lg font-semibold'>
        이미지 저장
      </button>
    </div>
  </div>

  <div id='contact-block-sheet' class='wizard-sheet hidden' role='dialog' aria-modal='true' aria-labelledby='contact-block-title'>
    <button type='button' class='wizard-sheet-backdrop' onclick='closeContactBlock()' aria-label='닫기'></button>
    <div class='wizard-sheet-panel'>
      <h2 id='contact-block-title'>고객 연락처가 없습니다</h2>
      <p class='precheck-sheet-copy'>카카오톡으로 보내기 전에 고객 연락처를 입력해 주세요.</p>
      <a id='contact-edit-link' class='sheet-link-primary' href='index.html?from=edit'>견적 수정</a>
    </div>
  </div>

  <div id='message-sheet' class='wizard-sheet hidden' role='dialog' aria-modal='true' aria-labelledby='message-sheet-title'>
    <button type='button' class='wizard-sheet-backdrop' onclick='closeMessageSheet()' aria-label='닫기'></button>
    <div class='wizard-sheet-panel message-sheet-panel'>
      <h2 id='message-sheet-title'>카톡 문구</h2>
      <textarea id='kakao-message-text' aria-label='카카오톡 문구'></textarea>
      <div class='message-sheet-actions'>
        <button type='button' onclick='copyKakaoMessage()'>복사</button>
        <button type='button' class='wizard-sheet-primary' onclick='shareFromMessageSheet()'>카카오톡으로 보내기</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=74"></script>
  <script src="/js/auth.js?v=74"></script>
  <script src="/js/ui.js?v=74"></script>
  <script src="/js/calc.js?v=74"></script>
  <script src="/js/app.js?v=74"></script>
  <script src="/js/estimate.js?v=74"></script>
  <script src='/js/precheck.js?v=74'></script>
  <script src='/js/kakao-message.js?v=74'></script>
  <script>
    let estimateData = null;
    let currentDoc = 'formal';
    let savedEmphasisShown = false;

    document.addEventListener('DOMContentLoaded', async () => {
      // URL에서 문서 타입 확인
      const params = new URLSearchParams(window.location.search);
      if (params.get('doc') === 'transaction') currentDoc = 'transaction';

      if (!Auth.guard()) {
        window.addEventListener('yr-authenticated', init);
        return;
      }
      init();
    });

    async function init() {
      UI.renderTabBar('estimate');
      const params = new URLSearchParams(window.location.search);
      const estimateId = params.get('id');
      if (!estimateId) { showError('견적 ID가 없습니다.'); return; }

      try {
        const cached = sessionStorage.getItem('yr-estimate-' + estimateId);
        estimateData = cached ? JSON.parse(cached) : await API.getEstimate(estimateId);
        if (!estimateData || estimateData.error || !Array.isArray(estimateData.items) || !estimateData.items.length) { showError(estimateData?.error || '견적 데이터를 찾을 수 없습니다.'); return; }
        if (!estimateData.estimateId) estimateData.estimateId = estimateId;
        renderDoc();
      } catch (err) {
        showError(err.message || '견적을 불러오는 중 오류가 발생했습니다.');
      }
    }

    function renderDoc() {
      const loadingEl = document.getElementById('loading-state');
      const previewEl = document.getElementById('preview-area');
      const buttonsEl = document.getElementById('action-buttons');
      const tabsEl = document.getElementById('doc-tabs');

      const containerEl = document.getElementById('preview-container');

      loadingEl.classList.add('hidden');
      containerEl.classList.remove('hidden');
      buttonsEl.classList.remove('hidden');
      tabsEl.classList.remove('hidden');
      document.getElementById('preview-fixed-actions').classList.remove('hidden');
      emphasizeSavedShareAction();

      // 마진 토글 표시 (마진 항목이 있을 때만)
      const marginToggle = document.getElementById('margin-toggle');
      const items = estimateData.items || [];
      const parsed = typeof items === 'string' ? JSON.parse(items) : items;
      const hasMargin = parsed.some(i => i.itemType === 'custom' && (i.name || '').includes('마진'));
      if (marginToggle) marginToggle.classList.toggle('hidden', !hasMargin);

      // 마진 숨기기 옵션
      const hideMargin = document.getElementById('chk-hide-margin')?.checked || false;
      const opts = hideMargin ? { hideMargin: true } : undefined;

      // 탭 활성화
      document.querySelectorAll('.doc-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.doc === currentDoc);
      });

      switch (currentDoc) {
        case 'transaction':
          previewEl.innerHTML = Estimate.renderTransactionStatement(estimateData, opts);
          document.getElementById('page-title').textContent = '거래명세표';
          break;
        case 'simple':
          previewEl.innerHTML = Estimate.renderPreview(estimateData, opts);
          document.getElementById('page-title').textContent = '간편 견적서';
          break;
        default:
          previewEl.innerHTML = Estimate.renderFormalQuotation(estimateData, opts);
          document.getElementById('page-title').textContent = '정식 견적서';
      }

      // A4 스케일 적용 (정식/거래명세표만)
      if (currentDoc === 'simple') {
        previewEl.style.width = '';
        previewEl.style.transform = '';
        previewEl.classList.remove('a4-wrapper');
        containerEl.style.height = '';
      } else {
        previewEl.classList.add('a4-wrapper');
        requestAnimationFrame(() => {
          const containerW = containerEl.clientWidth;
          const docW = 700;
          const scale = Math.min(1, containerW / docW);
          previewEl.style.transform = `scale(${scale})`;
          previewEl.style.width = docW + 'px';
          containerEl.style.height = (previewEl.scrollHeight * scale) + 'px';
        });
      }
    }

    function switchDoc(type) {
      currentDoc = type;
      renderDoc();
    }

    function showError(message) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-message').textContent = message;
    }

    function emphasizeSavedShareAction() {
      if (savedEmphasisShown || new URLSearchParams(location.search).get('just_saved') !== '1') return;
      savedEmphasisShown = true;
      const button = document.getElementById('btn-share-fixed');
      button.classList.add('just-saved-pulse');
      setTimeout(() => button.classList.remove('just-saved-pulse'), 2000);
    }

    function hasCustomerContact() {
      return Boolean(String(estimateData && (estimateData.phone || estimateData.customerPhone) || '').trim());
    }

    function showContactBlock() {
      var id = estimateData && estimateData.estimateId || new URLSearchParams(location.search).get('id') || '';
      document.getElementById('contact-edit-link').href = 'index.html?from=edit&editId=' + encodeURIComponent(id);
      document.getElementById('contact-block-sheet').classList.remove('hidden');
    }

    function closeContactBlock() {
      document.getElementById('contact-block-sheet').classList.add('hidden');
    }

    function openMessageSheet() {
      if (!estimateData) return;
      document.getElementById('kakao-message-text').value = KakaoMessage.build(estimateData, Estimate.getBranding());
      document.getElementById('message-sheet').classList.remove('hidden');
    }

    function closeMessageSheet() {
      document.getElementById('message-sheet').classList.add('hidden');
    }

    async function copyKakaoMessage() {
      var textarea = document.getElementById('kakao-message-text');
      try {
        await navigator.clipboard.writeText(textarea.value);
      } catch (_) {
        textarea.select();
        document.execCommand('copy');
      }
      UI.toast('문구를 복사했어요. 카톡에 붙여넣기 하세요', 'success', 4000);
    }

    function shareFromMessageSheet() {
      closeMessageSheet();
      handleShare();
    }

    async function handleShare() {
      if (!estimateData) return;
      if (!hasCustomerContact()) {
        showContactBlock();
        return;
      }
      const hideMargin = document.getElementById('chk-hide-margin')?.checked || false;
      const opts = hideMargin ? { hideMargin: true } : undefined;
      try {
        const shared = await Estimate.share(estimateData, currentDoc, opts);
        if (!shared) return;
      } catch (err) { UI.toast(err.message || '공유에 실패했습니다. 다시 시도하세요.', 'error'); return; }

      // 요청에서 온 견적이면 → 견적발송 상태 + estimateId 연결
      const params = new URLSearchParams(location.search);
      const reqRow = params.get('requestRowIndex');
      if (reqRow && estimateData && estimateData.estimateId) {
        try {
          await API.updateRequestStatus(Number(reqRow), '견적발송');
          await API.linkEstimateToRequest(Number(reqRow), estimateData.estimateId);
          UI.toast('요청 상태가 견적발송으로 변경되었습니다', 'info', 3000);
        } catch {}
      }
    }

    function handleDownload() {
      Estimate.downloadImage(currentDoc);
    }
  </script>
  <script src="/js/sw-register.js"></script>
</body>
</html>
