function manage(){mode('tabs');return header('관리')+'<h2>앱 설정</h2><div class="manage-list section">'+manageItems.map((x,i)=>'<button class="row" onclick="'+(i===0?"go('prices')":"info('"+x[0]+" 설정 화면입니다.')")+'"><span><strong>'+x[0]+'</strong><span>'+x[1]+'</span></span><span class="chevron">›</span></button>').join('')+'</div>'+nav('manage')}
function prices(){mode('sheet');return header('단가표','manage')+'<h2>랙 종류</h2><div class="manage-list section">'+racks.slice(0,6).map((r,i)=>'<button class="row" onclick="state.priceType='+i+';go(\'priceList\')"><span><strong>'+r.name+'</strong><span>'+r.specs.length+'개 대표 규격</span></span><span class="chevron">›</span></button>').join('')+'</div>'}
function priceList(){mode('sheet');const r=racks[state.priceType];return header(r.name,'prices')+'<h2>단가 목록</h2><div class="manage-list section">'+r.specs.map((s,i)=>'<button class="row" onclick="priceSheet('+i+')"><span><strong>'+s[0]+'</strong><span>독립 '+won(s[2])+' · 연결 '+won(s[3])+'</span></span><span class="chevron">›</span></button>').join('')+'</div>'}
function render(){state.hint='';const views={home,types:direct,specs:direct,qty:direct,review,saving,done,inbox,quoteDetail,manage,prices,priceList};document.getElementById('app').innerHTML=(views[state.screen]||home)()}
function scrollToSets(){document.getElementById('frequentSets')?.scrollIntoView({behavior:'smooth',block:'start'})}function startDirect(){state.type=null;state.spec=null;state.items=[];state.qty=4;go('types')}function chooseType(i){if(state.type!==i)state.spec=null;state.type=i;render()}function chooseSpec(i){state.spec=i;render()}function changeQty(n){state.qty=Math.max(1,Math.min(99,state.qty+n));render()}
function addAndReview(){if(state.type===null||state.spec===null){disabledHint('종류와 규격을 먼저 선택해 주세요.','sheetHint');return}const r=racks[state.type],s=r.specs[state.spec];state.items.push({type:r.name,spec:s[0],detail:s[1],solo:s[2],connect:s[3],qty:state.qty});go('review')}
function addDemo(){const r=racks[2],s=r.specs[0];state.items=[{type:r.name,spec:s[0],detail:s[1],solo:s[2],connect:s[3],qty:4}]}function useSet(i){const set=sets[i],r=racks[set.type],s=r.specs[0];state.items=[{type:r.name,spec:s[0],detail:s[1],solo:s[2],connect:s[3],qty:set.qty}];state.fees.transport=set.transport;go('review')}function copyQuote(){state.customer={name:'김지영',phone:'010-4821-9032',address:'용인시 처인구 모현읍'};addDemo();go('review')}
function itemQty(i,n){state.items[i].qty=Math.max(1,state.items[i].qty+n);render()}function removeItem(i){state.undo={item:state.items.splice(i,1)[0],index:i};render()}function undoRemove(){if(state.undo){state.items.splice(state.undo.index,0,state.undo.item);state.undo=null;render()}}function toggleFee(k){state.fees[k]=!state.fees[k];render()}function setMargin(v){state.margin=Math.max(0,Number(v)||0);render()}function setSearch(v){state.search=v;render()}function openQuote(i){state.priceSpec=i;go('quoteDetail')}function startInquiry(i){state.customer={name:inquiries[i].name,phone:inquiries[i].phone,address:inquiries[i].address};state.items=[];go('types')}
function disabledHint(message,id){state.hint=message;const el=document.getElementById(id);if(el)el.textContent=message;clearTimeout(disabledHint.timer);disabledHint.timer=setTimeout(()=>{state.hint='';const x=document.getElementById(id);if(x)x.textContent=''},3000)}
function saveQuote(){if(state.isSaving)return;const t=totals();if(state.discount>t.afterMargin){disabledHint('할인 금액을 확인해 주세요.','reviewHint');return}state.savedTotal=t.total;state.isSaving=true;render();setTimeout(()=>{state.screen='saving';state.savePhase=0;render();setTimeout(()=>{state.savePhase=1;render()},450);setTimeout(()=>{state.savePhase=2;render()},900);setTimeout(()=>{state.isSaving=false;go('done')},1300)},120)}
function overlay(x){document.getElementById('overlay').innerHTML=x}function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function customerSheet(){overlay('<div class="modal-bg sheet-bg"><section class="sheet"><h2>고객 정보</h2><div class="field"><label>이름</label><input id="customerName" class="input" value="'+(state.customer?.name||'김지영')+'"></div><div class="field"><label>전화</label><input id="customerPhone" class="input" value="'+(state.customer?.phone||'010-4821-9032')+'"></div><div class="field"><label>현장 주소</label><input id="customerAddress" class="input" value="'+(state.customer?.address||'용인시 처인구 모현읍')+'"></div><button class="btn ink action64" onclick="saveCustomer()">고객 정보 저장</button><button class="btn" onclick="closeOverlay()">취소</button></section></div>')}
function saveCustomer(){state.customer={name:document.getElementById('customerName').value||'김지영',phone:document.getElementById('customerPhone').value||'010-4821-9032',address:document.getElementById('customerAddress').value||'용인시 처인구 모현읍'};closeOverlay();render()}
function openPad(kind){state.padKind=kind;state.padValue=String(kind==='qty'?state.qty:state.discount||'');overlay('<div class="modal-bg sheet-bg"><section class="sheet"><h2>'+(kind==='qty'?'수량 입력':'할인 금액')+'</h2><input id="padDisplay" class="pad-display" value="'+(state.padValue||0)+'" readonly><div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(v=>'<button onclick="padKey(\''+v+'\')">'+v+'</button>').join('')+'<button onclick="padKey(\'clear\')">지우기</button><button onclick="padKey(\'0\')">0</button><button onclick="padDone()">완료</button></div></section></div>')}
function padKey(k){state.padValue=k==='clear'?state.padValue.slice(0,-1):(state.padValue==='0'?'':state.padValue)+k;document.getElementById('padDisplay').value=state.padValue||0}function padDone(){const v=Number(state.padValue)||0;if(state.padKind==='qty')state.qty=Math.max(1,Math.min(99,v));else state.discount=Math.max(0,v);closeOverlay();render()}
function phoneSheet(){overlay('<div class="modal-bg sheet-bg"><section class="sheet"><h2>전화 문의 등록</h2><div class="field"><label>이름</label><input class="input" placeholder="고객 이름"></div><div class="field"><label>전화</label><input class="input" placeholder="010-0000-0000"></div><div class="field"><label>주소</label><input class="input" placeholder="현장 주소"></div><div class="field"><label>메모</label><textarea class="input" placeholder="통화 내용을 적어 주세요"></textarea></div><button class="btn ink action64" onclick="info(\'전화 문의를 업무함에 등록했습니다.\')">등록</button><button class="btn" onclick="closeOverlay()">취소</button></section></div>')}
function priceSheet(i){state.priceSpec=i;const r=racks[state.priceType],s=r.specs[i];overlay('<div class="modal-bg sheet-bg"><section class="sheet"><h2>단가 수정</h2><p class="muted">'+r.name+' · '+s[0]+'</p><div class="field section"><label>독립형 단가</label><div class="input-wrap"><input id="solo" class="input with-unit" value="'+s[2]+'"><span class="unit">원</span></div></div><div class="field"><label>연결형 단가</label><div class="input-wrap"><input id="connect" class="input with-unit" value="'+s[3]+'"><span class="unit">원</span></div></div><button class="btn ink action64" onclick="savePrice()">단가 저장</button><button class="btn" onclick="closeOverlay()">취소</button></section></div>')}function savePrice(){const s=racks[state.priceType].specs[state.priceSpec];s[2]=Number(document.getElementById('solo').value)||s[2];s[3]=Number(document.getElementById('connect').value)||s[3];closeOverlay();render()}
function sendModal(){if(!state.customer){overlay('<div class="modal-bg"><section class="modal"><h2>고객을 먼저 입력해 주세요</h2><p class="muted">받는 분의 이름과 전화번호가 필요합니다.</p><button class="btn ink" onclick="closeOverlay();customerSheet()">고객 입력</button><button class="btn" onclick="closeOverlay()">닫기</button></section></div>');return}overlay('<div class="modal-bg"><section class="modal"><h2>'+state.customer.name+' 고객께 보낼까요?</h2><p class="muted">총액 '+won(state.savedTotal||totals().total)+' 견적서입니다.</p><button class="btn accent" onclick="info(\'카카오톡 공유창을 열 준비가 되었습니다.\')">보내기</button><button class="btn" onclick="closeOverlay()">다시 보기</button></section></div>')}function info(message){overlay('<div class="modal-bg"><section class="modal"><h2>안내</h2><p>'+message+'</p><button class="btn ink" onclick="closeOverlay()">확인</button></section></div>')}
function runFlowForTest(){startDirect();chooseType(2);chooseSpec(0);changeQty(0);addAndReview();state.customer={name:'테스트 고객',phone:'010-0000-0000',address:'용인'};state.margin=10;state.discount=10000;render();const total=totals().total;state.savedTotal=total;state.screen='saving';render();state.savePhase=2;render();state.screen='done';render();state.screen='inbox';render();return total>0&&state.items.length===1&&document.getElementById('app').innerHTML.includes('업무함')}
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(x&&x!==state.screen){state.screen=x;render()}});const initial=location.hash.slice(1);if(initial)state.screen=initial;if(['review','saving','done'].includes(state.screen))addDemo();if(state.screen==='done')state.customer={name:'김지영',phone:'010-4821-9032',address:'용인시 처인구 모현읍'};render();
</script></body></html>
