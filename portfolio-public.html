  <main class="max-w-lg mx-auto px-4 py-6">
    <section class="bg-white rounded-xl p-5 mb-5" aria-labelledby="portfolio-intro-title">
      <h2 id="portfolio-intro-title" class="text-lg font-bold">매장과 창고의 랙 설치 사례</h2>
      <p class="mt-2 text-sm">중용랙은 용인 기반으로 매장 진열대·창고 선반 설치를 상담합니다. 아래 공개 사례와 네이버 블로그의 현장 기록을 참고해 주세요. 상품 규격과 실제 시공 범위는 상담을 통해 확인합니다.</p>
      <p class="mt-3 text-sm"><a href="https://blog.naver.com/yongin_rack" target="_blank" rel="noopener noreferrer" class="text-primary underline">네이버 블로그 시공 기록</a> · <a href="/" class="text-primary underline">중용랙 서비스 안내</a> · <a href="/request.html" class="text-primary underline">설치 견적 요청</a></p>
    </section>
    <!-- 로딩 -->
    <div id="loading" class="space-y-3">
      <div class="animate-pulse bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="h-44 bg-gray-200"></div>
        <div class="p-4"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-1/2"></div></div>
      </div>
      <div class="animate-pulse bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="h-44 bg-gray-200"></div>
        <div class="p-4"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-1/2"></div></div>
      </div>
    </div>

    <!-- 게시글 리스트 -->
    <div id="post-list" class="hidden space-y-3"></div>

    <!-- 블로그 더보기 -->

        target="_blank"
        class="inline-flex items-center gap-2 text-sm font-bold text-primary">
        <span>블로그에서 더 보기</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </div>

    <!-- 빈 상태 -->

      <div class="v2-empty-marker"></div>
      <h3 class="text-lg font-bold text-gray-700 mb-2">시공 사례 준비중</h3>
      <p class="text-sm text-gray-500 mb-4">곧 시공 사진이 업로드됩니다.</p>
      <a href="https://blog.naver.com/PostList.naver?blogId=yongin_rack&from=postList&categoryNo=6&parentCategoryNo=6"
        target="_blank" class="inline-block bg-primary text-white px-6 py-3 rounded-xl font-bold text-sm">
        블로그에서 보기
      </a>
    </div>

  <!-- 플로팅 하단 CTA -->
  <div class="v2-fixed-cta fixed bottom-0 left-0 right-0 z-40" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-lg mx-auto px-4">
      <div class="bg-white rounded-xl shadow-sm px-2 py-2 flex gap-2">
        <a href="tel:0507-1482-1708"
          class="flex-1 h-16 bg-white rounded-xl text-gray-800 font-bold text-xs flex items-center justify-center gap-2 transition-colors">

          class="v2-primary-action flex-[1.5] h-16 bg-primary rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

        </a>

  <script>
    const RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://rss.blog.naver.com/yongin_rack.xml';
    const safeText = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function safeUrl(value) { try { if (!value) return ''; const url = new URL(value, location.origin); return /^https?:$/.test(url.protocol) ? safeText(url.href) : ''; } catch { return ''; } }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(RSS_URL);
        const data = await res.json();
        document.getElementById('loading').classList.add('hidden');

        if (data.status !== 'ok' || !data.items || data.items.length === 0) {
          document.getElementById('empty-state').classList.remove('hidden');
          return;
        }

        const list = document.getElementById('post-list');
        list.classList.remove('hidden');
        document.getElementById('blog-link').classList.remove('hidden');

        list.innerHTML = data.items.map(post => {
          const date = post.pubDate ? new Date(post.pubDate).toLocaleDateString('ko-KR') : '';
          // description에서 HTML 태그 제거
          const desc = (post.description || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
          const shortDesc = desc.length > 80 ? desc.substring(0, 80) + '...' : desc;
          // 카테고리 추출 (categories 배열)
          const category = post.categories && post.categories[0] ? post.categories[0] : '';

          return `
            <a href="${safeUrl(post.link)}" target="_blank" rel="noopener noreferrer"
              class="block bg-white rounded-xl border border-gray-100 overflow-hidden active:bg-gray-50 transition-colors">
              ${safeUrl(post.thumbnail) ? `
              <img src="${safeUrl(post.thumbnail)}" alt="" class="w-full h-44 object-cover bg-gray-100"
                onerror="this.classList.add('hidden')" loading="lazy">` : ''}
              <div class="p-4">
                ${category ? `<span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-primary mb-2">${safeText(category)}</span>` : ''}
                <h3 class="text-sm font-bold text-gray-800 mb-1 line-clamp-2">${safeText(post.title)}</h3>
                <p class="text-xs text-gray-500 line-clamp-2 mb-2">${safeText(shortDesc)}</p>
                <span class="text-xs text-gray-400">${safeText(date)}</span>
              </div>
            </a>
          `;
        }).join('');
      } catch {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('empty-state').classList.remove('hidden');
      }
    });
  </script>
