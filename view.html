<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>견적서 확인 - 중용</title>
  <meta property="og:title" content="[중용] 맞춤형 견적서가 도착했습니다">
  <meta property="og:description" content="용인 랙(선반) 전문 시공 견적서를 확인하세요.">
  <meta property="og:image" content="assets/og-image.jpg">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2F6BFF',accent:'#FF6B00'},fontFamily:{sans:['Pretendard','-apple-system','BlinkMacSystemFont','sans-serif']}}}}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/design.css?v=82">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  <style>
    :root{--bg:#F2F4F6;--canvas:#F2F4F6;--surface:#FFFFFF;--fill:#F2F4F6;--fill-2:#E5E8EB;--line:#EEF0F2;--rule:#EEF0F2;--text:#191F28;--ink:#191F28;--text-2:#4E5968;--ink-2:#4E5968;--text-3:#8B95A1;--brand:#2F6BFF;--brand-weak:#E8F0FF;--accent:#FF6B00;--ok:#1FA36B;--ok-weak:#E6F7EF;--danger:#F04452;--danger-weak:#FEECEE;--r-card:20px;--r-ctl:14px;--r-chip:999px;--r-sheet:24px;--shadow-card:0 2px 12px rgba(25,31,40,.06);--s1:8px;--s2:12px;--s3:16px;--s4:20px;--s5:24px;--s6:32px}
    body{font-family:'Pretendard',sans-serif;padding-bottom:80px}
    .a4-wrapper{width:700px;transform-origin:top left}
    .a4-container{overflow:hidden}
    .quote-summary{max-width:672px;margin:0 auto 24px;padding:24px;background:var(--surface);border-radius:var(--r-card);color:var(--text);font-size:16px}
    .quote-summary h1{font-size:24px;font-weight:700;margin-bottom:12px}
    .quote-summary .quote-total{font-size:28px;font-weight:700;color:var(--brand);margin:12px 0}
    .quote-summary li{padding:16px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
    .quote-summary small{display:block;font-size:14px;color:var(--text-2);margin-top:6px}
    @media(max-width:700px){.quote-summary{margin:0 16px 24px;padding:20px}}
  </style>
  <script src="js/version-check.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 로딩 -->
  <div id="loading" class="min-h-screen flex items-center justify-center">
    <div class="text-center px-6">
      <div class="animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mx-auto mb-4"></div>
      <p class="text-sm text-gray-500">견적서를 불러오는 중...</p>
    </div>
  </div>

  <!-- 견적서 영역 -->
  <div id="estimate-page" class="hidden py-4">
    <section id="quote-summary" class="quote-summary" aria-label="견적 요약"></section>
    <div class="max-w-2xl mx-4 sm:mx-auto a4-container" id="preview-container">
      <div id="preview-area" class="a4-wrapper"></div>
    </div>
      <!-- 이미지 저장 버튼 -->
      <div class="mt-4 text-center">
        <button onclick="downloadImg()"
          class="inline-flex items-center gap-2 px-6 py-3 bg-white border-2 border-gray-200 rounded-xl font-bold text-sm text-gray-700 active:scale-[0.98] transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/></svg>
          이미지 저장
        </button>
      </div>
  </div>

  <!-- 플로팅 하단 CTA -->
  <div class="v2-fixed-cta fixed bottom-0 left-0 right-0 z-40" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-lg mx-auto px-4">
      <div class="bg-white rounded-xl shadow-sm px-2 py-2 flex gap-2">
        <a href="portfolio-public.html"
          class="flex-1 h-16 bg-white rounded-xl text-gray-800 font-bold text-xs flex items-center justify-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          시공사례
        </a>
        <a href="tel:01037761230"
          class="flex-1 h-16 bg-white rounded-xl text-gray-800 font-bold text-xs flex items-center justify-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          전화
        </a>
        <a href="https://pf.kakao.com/_PbpFn" target="_blank"
          class="v2-kakao-action flex-1 h-16 bg-[#FEE500] rounded-xl text-[#3C1E1E] font-bold text-xs flex items-center justify-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.463 2 10.691c0 2.72 1.8 5.108 4.509 6.457l-.926 3.41a.312.312 0 00.472.334l3.963-2.627c.645.09 1.306.137 1.982.137 5.523 0 10-3.463 10-7.711S17.523 3 12 3z"/></svg>
          카톡
        </a>
        <a href="request.html"
          class="v2-primary-action flex-[1.5] h-16 bg-primary rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2 transition-colors">
          견적 요청
        </a>
      </div>
    </div>
  </div>

  <!-- 에러 -->
  <div id="error-page" class="hidden min-h-screen flex items-center justify-center">
    <div class="text-center px-6">
      <div class="v2-empty-marker"></div>
      <p class="text-lg font-bold text-gray-700 mb-2">견적서를 찾을 수 없습니다</p>
      <p class="text-sm text-gray-500 mb-6">링크가 올바른지 확인해주세요.</p>
      <p id="error-detail" class="text-base text-gray-600 mb-6" role="alert"></p>
      <a href="request.html" class="inline-block bg-primary text-white px-6 py-3 rounded-xl font-bold text-sm">견적 요청하기</a>
    </div>
  </div>

  <script src="js/api.js?v=82"></script>
  <script src="js/ui.js?v=82"></script>
  <script src="js/calc.js?v=82"></script>
  <script src="js/estimate.js?v=82"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const id = params.get('id');

      if (!token && !id) { showError(); return; }

      try {
        let data;
        if (token) {
          // 토큰 기반 조회 (보안 URL)
          data = await API.getEstimateByToken(token);
        } else {
          showError('이전 방식의 공유 링크입니다. 중용랙에 새 견적 링크를 요청해주세요.');
          return;
        }
        if (!data || data.error) { showError(); return; }
        data.estimateId = data.estimateId || id;
        render(data);
      } catch (err) {
        showError(err.message || '연결 상태를 확인하고 다시 시도해주세요.');
      }
    });

    function render(data) {
      if (!Array.isArray(data.items) || !data.items.length) { showError('견적 품목을 확인할 수 없습니다. 새 링크를 요청하세요.'); return; }
      if (data.branding) Estimate.setBranding(data.branding);
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('estimate-page').classList.remove('hidden');

      const previewEl = document.getElementById('preview-area');
      const containerEl = document.getElementById('preview-container');
      const docType = data.docType || 'formal';
      const opts = data.hideMargin ? { hideMargin: true } : undefined;
      const totals = Calc.calcTotals(data.items);
      const esc = UI.escapeHtml;
      document.getElementById('quote-summary').innerHTML = `<h1>중용랙 견적 안내</h1>
        <p>${esc(data.customerName || data.company || '고객')}님 · ${esc(data.estimateId || '')}</p>
        <p class="quote-total">${UI.formatCurrency(totals.total)}</p>
        <p>공급가액 ${UI.formatCurrency(totals.supplyTotal)} · 부가세 ${UI.formatCurrency(totals.vat)}</p>
        <ul>${data.items.map(item => `<li><strong>${esc(item.itemType === 'custom' ? item.name : item.type)}</strong>
          <small>${esc([item.form, item.spec, item.tier ? item.tier + '단' : ''].filter(Boolean).join(' · '))}</small>
          <p>${Number(item.quantity) || 1}${item.itemType === 'custom' ? '식' : '대'} · ${UI.formatCurrency((Number(item.unitPrice) + (item.itemType === 'custom' ? 0 : Number(item.installFee || 0))) * (Number(item.quantity) || 1))}</p></li>`).join('')}</ul>
        <p>변경할 내용이 있으면 견적번호를 알려주세요.</p><a href="tel:01037761230" class="block mt-4 text-primary font-bold">이 견적 전화 상담</a>`;

      if (docType === 'transaction') {
        previewEl.innerHTML = Estimate.renderTransactionStatement(data, opts);
        document.title = `[중용] 거래명세표 - ${data.estimateId}`;
      } else {
        previewEl.innerHTML = Estimate.renderFormalQuotation(data, opts);
        document.title = `[중용] 견적서 - ${data.estimateId}`;
      }

      // A4 스케일 적용
      function fitDocument() {
        const containerW = containerEl.clientWidth;
        const docW = 700;
        const scale = Math.min(1, containerW / docW);
        previewEl.style.transform = `scale(${scale})`;
        containerEl.style.height = (previewEl.scrollHeight * scale) + 'px';
      }
      requestAnimationFrame(fitDocument);
      window.addEventListener('resize', fitDocument);
      if (document.fonts) document.fonts.ready.then(fitDocument);
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitDocument).observe(previewEl);
    }

    function showError(message) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-page').classList.remove('hidden');
      document.getElementById('error-detail').textContent = message || '견적 링크가 없거나 사용할 수 없습니다. 새 링크를 요청해주세요.';
    }

    async function downloadImg() {
      const card = document.getElementById('estimate-card');
      if (!card || typeof html2canvas === 'undefined') return;
      try {
        const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#fff', useCORS: true });
        const link = document.createElement('a');
        link.download = '견적서_' + new Date().toISOString().slice(0,10) + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch { UI.toast('이미지를 저장하지 못했습니다. 다시 시도해주세요.', 'error'); }
    }
  </script>
</body>
</html>
